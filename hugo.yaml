baseURL: "https://preskirimasyaro.github.io/"
title: "PresKS Blog"
languageCode: "zh-cn"
defaultContentLanguage: "zh"
hasCJKLanguage: true
theme: ["PaperMod"]

# 分页设置（Hugo 0.128.0+ 使用新语法）
pagination:
  pagerSize: 10

# URL 永久链接配置
permalinks:
  posts: "/posts/:slug/"
  page: "/:slug/"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# 启用 Google Analytics 4
services:
  googleAnalytics:
    id: "" # 填入自己的 GA4 衡量 ID 后启用

# 启用搜索功能（需要 JSON 输出）
outputs:
  home:
    - HTML
    - RSS
    - JSON  # 搜索索引需要

minify:
  disableXML: true
  minifyOutput: true

# PaperMod 主题参数
params:
  math: true # 全站启用数学公式，可在单篇文章中设置 math: false
  env: production  # 启用分析和生产特性
  title: "PresKS Blog"
  description: "基于 Hugo 和 PaperMod 主题的个人博客"
  keywords: [博客, 技术分享, 个人作品]
  author: "PresKirimaSyaro"

  # 显示设置
  defaultTheme: auto  # auto, dark, light
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false # 配置 Giscus 后改为 true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  # 首页信息
  homeInfoParams:
    Title: "欢迎来到 PresKS Blog"
    Content: >
      这是一个博客。
      使用 Hugo 和 PaperMod 主题构建。

  # 社交链接
  socialIcons:
    - name: github
      url: "https://github.com/PresKirimaSyaro"

  # 编辑文章链接
  editPost:
    URL: "https://github.com/PresKirimaSyaro/PresKirimaSyaro.github.io/tree/main/content"
    Text: "查看源码"
    appendFilePath: true

  giscus:
    repo: "PresKirimaSyaro/PresKirimaSyaro.github.io"
    repoId: ""
    category: "General"
    categoryId: ""

  # 搜索配置 (Fuse.js)
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# 导航菜单
menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 10
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40
    - identifier: friends
      name: 友链
      url: /friends/
      weight: 45
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 50
    - identifier: about
      name: 关于
      url: /about/
      weight: 60

# 分类系统
taxonomies:
  category: categories
  tag: tags
  series: series

# Markdown 渲染设置
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

# 隐私设置
privacy:
  googleAnalytics:
    anonymizeIP: true
    respectDoNotTrack: true
    useSessionStorage: false
