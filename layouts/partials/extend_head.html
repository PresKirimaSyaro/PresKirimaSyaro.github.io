{{- if .Param "math" -}}
<script>
window.MathJax = {
  tex: {
    packages: {'[+]': ['mathtools']},
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true,
    processEnvironments: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  },
  startup: {elements: ['.post-content']},
  loader: {load: ['ui/safe', '[tex]/mathtools']}
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>
{{- end -}}
