<script>
(() => {
  const updateWallpaper = () => {
    const now = new Date();
    const day = (now.getDay() + 6) % 7; // Monday starts the week.
    const elapsed = ((day * 24 + now.getHours()) * 60 + now.getMinutes()) * 60 * 1000
      + now.getSeconds() * 1000 + now.getMilliseconds();
    const image = Math.floor(elapsed / (7 * 24 * 60 * 60 * 1000 / 20));
    const extension = image === 0 ? "png" : "jpg";
    document.documentElement.style.setProperty(
      "--wallpaper-image", `url("/images/background/${image}.${extension}")`
    );
  };

  updateWallpaper();
  setInterval(updateWallpaper, 60 * 1000);
})();
</script>
